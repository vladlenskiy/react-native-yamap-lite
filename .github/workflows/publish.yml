name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # `npm publish` runs the package's prepublishOnly script (rm -rf build && tsc),
      # so the TypeScript sources are compiled fresh before the tarball is created.
      # The version check keeps the publish idempotent: if the version in package.json
      # is already on npm, the job succeeds without trying to republish (which npm
      # forbids), so re-runs and overlapping tag/release triggers stay green.
      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "react-native-yamap-lite@${VERSION}" version >/dev/null 2>&1; then
            echo "react-native-yamap-lite@${VERSION} is already published — nothing to do."
            exit 0
          fi
          echo "Publishing react-native-yamap-lite@${VERSION}..."
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
